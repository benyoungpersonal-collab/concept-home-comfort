  <!-- Optional section: Specials and discounts. Same markup as Pinwheel's partials/optional/specials.html, filled from "specials" in the data file. -->
  <section class="section specials" id="specials" aria-labelledby="specials-title">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow">Specials and discounts</p>
        <h2 id="specials-title">Deals for your <span class="accent">whole home.</span></h2>
        <p class="lead">Current offers for {{city}} area homeowners. Mention one when you reach out.</p>
      </div>
      <div class="deals">
        {{#each specials}}<article class="deal">
          <p class="deal-amount">{{amount}}</p>
          <h3>{{title}}</h3>
          {{#if text}}<p>{{text}}</p>{{/if}}
          <a class="btn btn-secondary btn-sm" href="#request">Claim this offer</a>
          {{#if fine}}<p class="fine">{{fine}}</p>{{/if}}
        </article>
        {{/each}}
      </div>
    </div>
  </section>
